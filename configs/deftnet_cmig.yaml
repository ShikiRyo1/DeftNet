# Canonical v0.2.0 configuration for the current CMIG manuscript protocol.
model:
  in_channels: 1
  out_channels: 1
  base_channels: 16
  norm: in
  expert_names: [E1, E2, E3, E4, E5]
  fusion_mode: hsaf
  use_deep_supervision: false
  use_feature_adapters: true
  adapter_dropout: 0.05
  adapter_residual: true
  hsaf_gate_dropout: 0.10
  hsaf_temperature: 1.5
  freeze_experts: true
  # Public method policy: shallow CNN-family, mid mixed, deep Transformer-family.
  band_policy:
    e1: [E1, E2, E3]
    e2: [E1, E2, E3]
    e3: [E1, E2, E3, E4, E5]
    e4: [E4, E5]
    e5: [E4, E5]

protocol:
  seeds: [0, 42, 44]
  threshold: 0.5
  test_time_augmentation: false
  perspective_folds: 5

phase1:
  epochs: 60
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.00001
  scheduler_t_max: 60
  scheduler_eta_min: 0.000001
  gradient_clip_norm: 5.0
  amp: true
  loss:
    w_bce: 0.50
    w_dice: 0.50
    w_cldice: 0.0

# Supply these paths at runtime or with --expert-checkpoint E1=... .
expert_checkpoints:
  E1: null
  E2: null
  E3: null
  E4: null
  E5: null

train:
  image_size: 512
  epochs: 60
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.00001
  scheduler_t_max: 60
  scheduler_eta_min: 0.000001
  gradient_clip_norm: 5.0
  amp: true
  loss:
    w_bce: 0.50
    w_dice: 0.50
    w_cldice: 0.0
