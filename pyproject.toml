[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deftnet"
version = "0.3.0"
description = "Depth-banded pre-decision routing of frozen heterogeneous experts for coronary X-ray angiography vessel-tree segmentation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Yuhui Wu" },
  { name = "Zhe Chen" },
  { name = "Kai Li" },
  { name = "Rob M. Ewing" },
  { name = "Zehor Belkhatir" },
  { name = "Yihua Wang" },
]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "pillow>=10.0",
  "scipy>=1.10",
  "scikit-image>=0.22",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.7",
  "pytest>=8.0",
]
viz = [
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
